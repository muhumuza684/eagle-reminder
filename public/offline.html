<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#012C3D" />
    <title>D-Eagle Hub — Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #F7F8F3;
        color: #012C3D;
      }
      main { width: min(560px, 100%); text-align: center; }
      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 22px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #012C3D;
        color: #F7F8F3;
        font-weight: 900;
        font-size: 20px;
        box-shadow: 0 14px 32px rgba(1, 44, 61, 0.18);
      }
      h1 { margin: 0; font-size: 34px; letter-spacing: -0.03em; }
      p { margin: 14px auto 0; max-width: 420px; color: #58727B; line-height: 1.55; }
      button {
        margin-top: 26px;
        border: 0;
        border-radius: 999px;
        padding: 13px 20px;
        background: #F8444F;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .accent { width: 72px; height: 5px; margin: 28px auto 0; border-radius: 999px; background: #78BDC4; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1>D-Eagle is offline</h1>
      <p>Your local work is still on this device. Reconnect to load the latest app resources.</p>
      <button onclick="location.reload()">Try again</button>
      <div class="accent"></div>
    </main>
  </body>
</html>
