name: D-Eagle Hub CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and Expo web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test suite
        run: npm test

      - name: Expo web export
        run: npm run build:web

      - name: Verify web artifact
        run: test -f web-build/index.html