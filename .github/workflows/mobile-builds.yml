name: D-Eagle Mobile Builds

on:
  push:
    branches:
      - main
      - design-system-foundation-onto-tier7-20260914-082007

  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

  android:
    name: EAS Android Preview APK
    needs: validate
    if: >
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android'

    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android preview APK
        run: >
          npx eas-cli@latest build
          --platform android
          --profile preview
          --non-interactive
          --wait

  ios:
    name: EAS iOS Preview
    needs: validate
    if: >
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.platform == 'all' ||
        github.event.inputs.platform == 'ios'
      )

    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build iOS preview
        run: >
          npx eas-cli@latest build
          --platform ios
          --profile preview
          --non-interactive
          --wait
